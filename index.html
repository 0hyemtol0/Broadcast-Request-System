<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영파여자중학교 방송요청 시스템</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'] },
          colors: {
            sage: {
              50: '#f4f7f4', 100: '#e6eee7', 200: '#cfddd1', 300: '#aac3ae', 400: '#7fa386',
              500: '#5d8766', 600: '#486c50', 700: '#3b5841', 800: '#324736', 900: '#2b3b2e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #f6f6f1; -webkit-font-smoothing: antialiased; }
    ::selection { background: #cfddd1; }
    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
      }
    }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Calendar as CalendarIcon, Clock, Video, Mic, Users, MapPin, FileText,
      Send, Bell, Settings, LogOut, Trash2, CheckCircle, AlertCircle, X,
      Shield, Key, ChevronLeft, ChevronRight, Pencil, Search, Download,
      Phone, Save, Info, Megaphone, Mail
    } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp } from 'firebase/firestore';

    // ==========================================
    // Firebase 설정
    // ==========================================
    let firebaseConfig = {
      apiKey: "AIzaSyApw-eOLuyrGb3mwIITzM1WlgAGKDV7_ZQ",
      authDomain: "yp-broadcast.firebaseapp.com",
      projectId: "yp-broadcast",
      storageBucket: "yp-broadcast.firebasestorage.app",
      messagingSenderId: "214272381910",
      appId: "1:214272381910:web:701dfae6067f5e45f90a77"
    };

    const isPreviewEnvironment = typeof __firebase_config !== 'undefined';
    if (isPreviewEnvironment) {
      firebaseConfig = JSON.parse(__firebase_config);
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'youngpa-broadcast-system';

    const DEFAULT_NOTIFY_EMAIL = 'uliya@youngpa.sen.ms.kr';

    // ==========================================
    // 공통 상수 / 유틸
    // ==========================================
    const departmentOptions = ['교무기획부', '미래교육연구부', '생활안전부', '진로진학교육부', '학생통합지원부', '기타'];
    const equipmentOptions = ['마이크', '컴퓨터 (PC)', '학생의자', '빔프로젝터', '스피커', '기타'];
    const broadcastTypes = ['동영상 시청', '강사 강의', '천장스피커만 사용', '행사 생중계(방송실에서 카메라 사용)', '기타'];
    const STATUSES = ['대기중', '승인됨', '완료', '반려'];
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];

    const emptyForm = {
      broadcastDate: '', startTime: '', endTime: '', content: '',
      department: '교무기획부', customDepartment: '',
      requester: '', contact: '', audience: '', location: '',
      broadcastType: '동영상 시청', customBroadcastType: '',
      equipment: [], scriptType: '필요없음', customScript: '',
      materialLink: '', fileDescription: '', remarks: ''
    };
    const formKeys = Object.keys(emptyForm).filter(k => k !== 'customDepartment' && k !== 'customBroadcastType');

    const pad = n => String(n).padStart(2, '0');
    const toYMD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const todayStr = () => toYMD(new Date());
    const fmtDate = s => {
      if (!s) return '';
      const [y, m, d] = s.split('-').map(Number);
      return `${m}월 ${d}일 (${DOW[new Date(y, m - 1, d).getDay()]})`;
    };
    const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
    const overlaps = (a, b) =>
      a.broadcastDate && a.broadcastDate === b.broadcastDate &&
      toMin(a.startTime) < toMin(b.endTime) && toMin(b.startTime) < toMin(a.endTime);
    const fmtCreated = ts => {
      const d = ts?.toDate?.();
      return d ? `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
    };

    const toFormState = (r) => {
      const f = { ...emptyForm };
      formKeys.forEach(k => { if (r[k] !== undefined) f[k] = r[k]; });
      f.equipment = r.equipment || [];
      if (!departmentOptions.includes(r.department)) { f.department = '기타'; f.customDepartment = r.department || ''; }
      if (!broadcastTypes.includes(r.broadcastType)) { f.broadcastType = '기타'; f.customBroadcastType = r.broadcastType || ''; }
      return f;
    };
    const fromFormState = (f) => {
      const out = {};
      formKeys.forEach(k => { out[k] = f[k]; });
      out.department = f.department === '기타' ? (f.customDepartment.trim() || '기타') : f.department;
      out.broadcastType = f.broadcastType === '기타' ? (f.customBroadcastType.trim() || '기타') : f.broadcastType;
      return out;
    };
    // 수정 내역 비교 (어떤 항목이 바뀌었는지)
    const FIELD_LABELS = {
      broadcastDate: '방송일', startTime: '시작 시간', endTime: '종료 시간', content: '방송 내용',
      department: '의뢰 부서', requester: '담당자', contact: '연락처', audience: '방송 대상', location: '장소',
      broadcastType: '방송 형태', equipment: '필요 준비물', scriptType: '아나운서 멘트', customScript: '멘트 내용',
      materialLink: '자료 링크', fileDescription: '파일 설명', remarks: '비고'
    };
    const normVal = v => Array.isArray(v) ? [...v].sort().join('|') : String(v ?? '').trim();
    const diffFields = (oldR, newD) => formKeys.filter(k => normVal(oldR[k]) !== normVal(newD[k])).map(k => FIELD_LABELS[k] || k);

    const validateForm = (f) => {
      if (!f.broadcastDate || !f.startTime || !f.endTime || !f.content.trim() || !f.requester.trim()) return '필수 항목(*)을 모두 입력해주세요.';
      if (toMin(f.endTime) <= toMin(f.startTime)) return '종료 시간은 시작 시간보다 늦어야 합니다.';
      return null;
    };

    // 상태별 색: 대기중=주황, 승인됨=초록, 완료=파랑, 반려=빨강
    const STATUS_STYLE = {
      '대기중': { badge: 'bg-amber-100 text-amber-900 border-amber-300', dot: 'bg-amber-500', bar: 'border-l-amber-400', solid: 'bg-amber-500 hover:bg-amber-600 text-white' },
      '승인됨': { badge: 'bg-emerald-100 text-emerald-900 border-emerald-300', dot: 'bg-emerald-500', bar: 'border-l-emerald-500', solid: 'bg-emerald-600 hover:bg-emerald-700 text-white' },
      '완료':   { badge: 'bg-blue-100 text-blue-900 border-blue-300', dot: 'bg-blue-500', bar: 'border-l-blue-500', solid: 'bg-blue-600 hover:bg-blue-700 text-white' },
      '반려':   { badge: 'bg-rose-100 text-rose-900 border-rose-300', dot: 'bg-rose-500', bar: 'border-l-rose-500', solid: 'bg-rose-600 hover:bg-rose-700 text-white' }
    };

    // 자료 링크: 줄마다 하나씩, http(s) 주소는 클릭 가능한 링크로 표시
    function LinkList({ text }) {
      const lines = (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return <span className="text-stone-400">없음</span>;
      return (
        <ul className="space-y-1">
          {lines.map((line, i) => (
            <li key={i} className="break-all">
              {line.split(/(\s+)/).map((tok, j) => /^https?:\/\//i.test(tok)
                ? <a key={j} href={tok} target="_blank" rel="noopener noreferrer" className="text-sage-700 hover:underline">{tok}</a>
                : <span key={j}>{tok}</span>)}
            </li>
          ))}
        </ul>
      );
    }

    const inputCls = "w-full rounded-xl border border-stone-200 bg-white px-3.5 py-2.5 text-[15px] text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-sage-300 focus:border-sage-400 transition";
    const btnPrimary = "inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-sage-600 hover:bg-sage-700 active:bg-sage-800 disabled:opacity-60 disabled:cursor-not-allowed transition shadow-sm";
    const btnGhost = "inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium text-stone-600 bg-white border border-stone-200 hover:bg-stone-50 transition";

    // ==========================================
    // 작은 공통 컴포넌트
    // ==========================================
    function StatusBadge({ status }) {
      const s = STATUS_STYLE[status] || STATUS_STYLE['대기중'];
      return <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold border ${s.badge}`}>
        <span className={`w-1.5 h-1.5 rounded-full ${(STATUS_STYLE[status] || STATUS_STYLE['대기중']).dot}`}></span>{status}
      </span>;
    }

    function Modal({ title, onClose, children, wide }) {
      useEffect(() => {
        const h = e => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);
      return (
        <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-3 sm:p-6 bg-stone-900/40 backdrop-blur-[2px] overflow-y-auto" onMouseDown={onClose}>
          <div className={`fade-in bg-white rounded-2xl shadow-xl w-full ${wide ? 'max-w-3xl' : 'max-w-md'} my-4`} onMouseDown={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-4 border-b border-stone-100">
              <h3 className="text-lg font-bold text-stone-800">{title}</h3>
              <button onClick={onClose} className="p-1.5 rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-600"><X className="w-5 h-5" /></button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Section({ icon: Icon, title, children }) {
      return (
        <section className="bg-white rounded-2xl border border-stone-200/70 shadow-[0_1px_2px_rgba(0,0,0,0.03)] p-5 sm:p-7">
          <h3 className="text-base font-bold text-stone-800 mb-5 flex items-center gap-2.5">
            <span className="w-8 h-8 rounded-lg bg-sage-100 text-sage-700 flex items-center justify-center"><Icon className="w-4 h-4" /></span>
            {title}
          </h3>
          {children}
        </section>
      );
    }

    function Field({ label, required, hint, children, className = '' }) {
      return (
        <div className={className}>
          <label className="block text-sm font-medium text-stone-600 mb-1.5">{label}{required && <span className="text-rose-400 ml-0.5">*</span>}</label>
          {children}
          {hint && <p className="text-xs text-stone-400 mt-1.5">{hint}</p>}
        </div>
      );
    }

    // ==========================================
    // 요청서 입력 필드 (신청 / 관리자 수정 공용)
    // ==========================================
    function FormFields({ data, setData, requests = [], excludeId = null }) {
      const set = (k, v) => setData(p => ({ ...p, [k]: v }));
      const ch = e => set(e.target.name, e.target.value);
      const toggleEq = eq => setData(p => ({
        ...p, equipment: p.equipment.includes(eq) ? p.equipment.filter(i => i !== eq) : [...p.equipment, eq]
      }));

      const conflicts = useMemo(() => {
        if (!data.broadcastDate || !data.startTime || !data.endTime || toMin(data.endTime) <= toMin(data.startTime)) return [];
        return requests.filter(r => r.id !== excludeId && r.status !== '반려' && overlaps(r, data));
      }, [requests, data.broadcastDate, data.startTime, data.endTime, excludeId]);

      return (
        <div className="space-y-5">
          <Section icon={CalendarIcon} title="방송 일정">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <Field label="방송일" required><input type="date" name="broadcastDate" value={data.broadcastDate} onChange={ch} className={inputCls} /></Field>
              <Field label="시작 시간" required><input type="time" name="startTime" value={data.startTime} onChange={ch} className={inputCls} /></Field>
              <Field label="종료 예정 시간" required><input type="time" name="endTime" value={data.endTime} onChange={ch} className={inputCls} /></Field>
            </div>
            {conflicts.length > 0 && (
              <div className="mt-4 flex gap-2.5 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900">
                <Info className="w-4 h-4 mt-0.5 shrink-0" />
                <p>같은 시간대에 다른 방송 요청이 {conflicts.length}건 있습니다. 접수는 가능하며, 방송부에서 시간을 조율해 안내드립니다.</p>
              </div>
            )}
            <div className="mt-4">
              <Field label="방송 내용 (목적)" required>
                <textarea name="content" value={data.content} onChange={ch} rows={2} placeholder="예: 학부모 총회 실시간 중계, 2학년 영어 듣기평가" className={inputCls} />
              </Field>
            </div>
          </Section>

          <Section icon={Users} title="요청자 정보">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <Field label="의뢰 부서">
                <select name="department" value={data.department} onChange={ch} className={inputCls}>
                  {departmentOptions.map(d => <option key={d} value={d}>{d}</option>)}
                </select>
                {data.department === '기타' && <input type="text" name="customDepartment" value={data.customDepartment} onChange={ch} placeholder="부서명을 직접 입력" className={`${inputCls} mt-2`} />}
              </Field>
              <Field label="담당자 (성함)" required><input type="text" name="requester" value={data.requester} onChange={ch} placeholder="홍길동 선생님" className={inputCls} /></Field>
              <Field label="연락처 (내선/휴대폰)"><input type="text" name="contact" value={data.contact} onChange={ch} placeholder="내선 123" className={inputCls} /></Field>
            </div>
          </Section>

          <Section icon={MapPin} title="방송 환경">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Field label="방송 대상"><input type="text" name="audience" value={data.audience} onChange={ch} placeholder="예: 전교생, 1학년 3반~5반" className={inputCls} /></Field>
              <Field label="장소"><input type="text" name="location" value={data.location} onChange={ch} placeholder="예: 시청각실, 체육관, 각 반 교실" className={inputCls} /></Field>
              <Field label="방송 형태">
                <select name="broadcastType" value={data.broadcastType} onChange={ch} className={inputCls}>
                  {broadcastTypes.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                {data.broadcastType === '기타' && <input type="text" name="customBroadcastType" value={data.customBroadcastType} onChange={ch} placeholder="방송 형태를 직접 입력" className={`${inputCls} mt-2`} />}
              </Field>
              <Field label="필요 준비물">
                <div className="flex flex-wrap gap-2">
                  {equipmentOptions.map(eq => {
                    const on = data.equipment.includes(eq);
                    return <button type="button" key={eq} onClick={() => toggleEq(eq)}
                      className={`px-3 py-1.5 rounded-full text-sm border transition ${on ? 'bg-sage-600 border-sage-600 text-white' : 'bg-white border-stone-200 text-stone-600 hover:border-sage-300'}`}>{eq}</button>;
                  })}
                </div>
              </Field>
            </div>
          </Section>

          <Section icon={FileText} title="세부 내용 및 자료">
            <Field label="아나운서 멘트">
              <div className="inline-flex p-1 bg-stone-100 rounded-xl">
                {['필요없음', '기본양식', '직접작성'].map(t => (
                  <button type="button" key={t} onClick={() => set('scriptType', t)}
                    className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${data.scriptType === t ? 'bg-white text-sage-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}>{t}</button>
                ))}
              </div>
              {data.scriptType === '직접작성' && <textarea name="customScript" value={data.customScript} onChange={ch} rows={3} placeholder="아나운서가 읽을 멘트를 정확히 적어주세요." className={`${inputCls} mt-3`} />}
              {data.scriptType === '기본양식' && (
                <p className="mt-3 text-sm text-stone-500 bg-stone-50 p-3 rounded-xl border border-stone-100">
                  안내방송 기본 양식이 적용됩니다. (예: "잠시 후 [내용] 관련 방송이 있을 예정입니다. 학생 여러분들은 자리에 착석해주시기 바랍니다.")
                </p>
              )}
            </Field>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-5">
              <Field label="방송 자료 링크 (여러 개는 한 줄에 하나씩)"><textarea name="materialLink" value={data.materialLink} onChange={ch} rows={4} placeholder={'https://...\nhttps://...'} className={`${inputCls} resize-y`} /></Field>
              <Field label="기타 자료/파일 설명"><input type="text" name="fileDescription" value={data.fileDescription} onChange={ch} placeholder="예: USB로 PPT 파일 직접 전달 예정" className={inputCls} /></Field>
            </div>
            <div className="mt-5">
              <Field label="비고 (기타 요청/참고사항)"><textarea name="remarks" value={data.remarks} onChange={ch} rows={2} placeholder="추가로 전달할 요청사항이 있다면 자유롭게 적어주세요." className={inputCls} /></Field>
            </div>
          </Section>
        </div>
      );
    }

    // ==========================================
    // 한 화면 신청서 (신청 화면 전용 · 스크롤 없이 한눈에)
    // ==========================================
    const cInput = "w-full rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-sage-300 focus:border-sage-400 transition";

    function CField({ label, required, className = '', children }) {
      return (
        <div className={className}>
          <label className="block text-xs font-semibold text-stone-500 mb-1">{label}{required && <span className="text-rose-400 ml-0.5">*</span>}</label>
          {children}
        </div>
      );
    }

    function CompactForm({ data, setData, requests, isSubmitting }) {
      const set = (k, v) => setData(p => ({ ...p, [k]: v }));
      const ch = e => set(e.target.name, e.target.value);
      const toggleEq = eq => setData(p => ({
        ...p, equipment: p.equipment.includes(eq) ? p.equipment.filter(i => i !== eq) : [...p.equipment, eq]
      }));

      const conflicts = useMemo(() => {
        if (!data.broadcastDate || !data.startTime || !data.endTime || toMin(data.endTime) <= toMin(data.startTime)) return [];
        return requests.filter(r => r.status !== '반려' && overlaps(r, data));
      }, [requests, data.broadcastDate, data.startTime, data.endTime]);

      return (
        <div className="bg-white rounded-2xl border border-stone-200/70 shadow-sm">
          <div className="flex items-center justify-between gap-3 px-5 sm:px-6 py-3.5 border-b border-stone-100 bg-gradient-to-r from-sage-50 to-white rounded-t-2xl">
            <div className="flex items-center gap-2.5">
              <span className="w-8 h-8 rounded-lg bg-sage-600 text-white flex items-center justify-center"><Megaphone className="w-4 h-4" /></span>
              <div>
                <h1 className="text-lg font-bold text-stone-800 leading-tight">방송 협조 요청서</h1>
                <p className="text-xs text-stone-500">필요한 내용을 입력하고 바로 제출해 주세요.</p>
              </div>
            </div>
            <span className="text-xs text-stone-400 shrink-0"><span className="text-rose-400">*</span> 필수 항목</span>
          </div>

          <div className="p-5 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-3.5">
            {/* 1행: 일정 + 부서 */}
            <CField label="방송일" required><input type="date" name="broadcastDate" value={data.broadcastDate} onChange={ch} className={cInput} /></CField>
            <CField label="시작 시간" required><input type="time" name="startTime" value={data.startTime} onChange={ch} className={cInput} /></CField>
            <CField label="종료 예정 시간" required><input type="time" name="endTime" value={data.endTime} onChange={ch} className={cInput} /></CField>
            <CField label="의뢰 부서">
              <select name="department" value={data.department} onChange={ch} className={cInput}>
                {departmentOptions.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
              {data.department === '기타' && <input type="text" name="customDepartment" value={data.customDepartment} onChange={ch} placeholder="부서명 직접 입력" className={`${cInput} mt-1.5`} />}
            </CField>

            {conflicts.length > 0 && (
              <div className="sm:col-span-2 lg:col-span-4 flex items-center gap-2 px-3 py-2 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900">
                <Info className="w-4 h-4 shrink-0" />
                <p>같은 시간대에 다른 방송 요청이 {conflicts.length}건 있습니다. 접수는 가능하며, 방송부에서 시간을 조율해 안내드립니다.</p>
              </div>
            )}

            {/* 2행: 요청자 + 대상/장소 */}
            <CField label="담당자 (성함)" required><input type="text" name="requester" value={data.requester} onChange={ch} placeholder="홍길동 선생님" className={cInput} /></CField>
            <CField label="연락처 (내선/휴대폰)"><input type="text" name="contact" value={data.contact} onChange={ch} placeholder="내선 123" className={cInput} /></CField>
            <CField label="방송 대상"><input type="text" name="audience" value={data.audience} onChange={ch} placeholder="예: 전교생, 1학년 3~5반" className={cInput} /></CField>
            <CField label="장소"><input type="text" name="location" value={data.location} onChange={ch} placeholder="예: 시청각실, 각 반 교실" className={cInput} /></CField>

            {/* 3행: 내용 + 형태 + 멘트 */}
            <CField label="방송 내용 (목적)" required className="sm:col-span-2">
              <textarea name="content" value={data.content} onChange={ch} rows={2} placeholder="예: 학부모 총회 실시간 중계, 2학년 영어 듣기평가" className={`${cInput} resize-none`} />
            </CField>
            <CField label="방송 형태">
              <select name="broadcastType" value={data.broadcastType} onChange={ch} className={cInput}>
                {broadcastTypes.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              {data.broadcastType === '기타' && <input type="text" name="customBroadcastType" value={data.customBroadcastType} onChange={ch} placeholder="방송 형태 직접 입력" className={`${cInput} mt-1.5`} />}
            </CField>
            <CField label="아나운서 멘트">
              <div className="flex p-0.5 bg-stone-100 rounded-lg">
                {['필요없음', '기본양식', '직접작성'].map(t => (
                  <button type="button" key={t} onClick={() => set('scriptType', t)}
                    className={`flex-1 px-2 py-1.5 rounded-md text-sm font-medium transition ${data.scriptType === t ? 'bg-white text-sage-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}>{t}</button>
                ))}
              </div>
              {data.scriptType === '기본양식' && <p className="text-[11px] text-stone-400 mt-1">안내방송 기본 양식이 적용됩니다.</p>}
            </CField>
            {data.scriptType === '직접작성' && (
              <CField label="아나운서 멘트 내용" className="sm:col-span-2 lg:col-span-4">
                <textarea name="customScript" value={data.customScript} onChange={ch} rows={2} placeholder="아나운서가 읽을 멘트를 정확히 적어주세요." className={`${cInput} resize-none`} />
              </CField>
            )}

            {/* 4행: 준비물 + 자료 */}
            <CField label="필요 준비물" className="sm:col-span-2">
              <div className="flex flex-wrap gap-1.5">
                {equipmentOptions.map(eq => {
                  const on = data.equipment.includes(eq);
                  return <button type="button" key={eq} onClick={() => toggleEq(eq)}
                    className={`px-2.5 py-1.5 rounded-full text-xs border transition ${on ? 'bg-sage-600 border-sage-600 text-white' : 'bg-white border-stone-200 text-stone-600 hover:border-sage-300'}`}>{eq}</button>;
                })}
              </div>
            </CField>
            <CField label="자료 링크 (유튜브, 드라이브 등 · 여러 개는 한 줄에 하나씩)" className="sm:col-span-2">
              <textarea name="materialLink" value={data.materialLink} onChange={ch} rows={3} placeholder={'https://...\nhttps://...\n(링크가 많으면 줄을 계속 추가하세요. 칸 오른쪽 아래를 끌면 더 커집니다)'} className={`${cInput} resize-y min-h-[76px]`} />
            </CField>

            {/* 5행: 파일 설명 + 비고 + 제출 */}
            <CField label="기타 자료/파일 설명"><input type="text" name="fileDescription" value={data.fileDescription} onChange={ch} placeholder="예: USB로 PPT 전달 예정" className={cInput} /></CField>
            <CField label="비고 (기타 요청/참고사항)" className="sm:col-span-2">
              <input type="text" name="remarks" value={data.remarks} onChange={ch} placeholder="추가로 전달할 요청사항이 있다면 적어주세요." className={cInput} />
            </CField>
            <div className="flex items-end">
              <button type="submit" disabled={isSubmitting} className={`${btnPrimary} w-full py-2.5`}>
                {isSubmitting
                  ? <><span className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span> 전송 중...</>
                  : <><Send className="h-4 w-4" /> 요청서 제출</>}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 내 신청 내역 (이 브라우저에서 신청한 것만 · 수정/삭제 가능)
    // ==========================================
    const STATUS_HINT = {
      '대기중': '방송부 확인을 기다리고 있어요.',
      '승인됨': '승인되었습니다. 방송일에 맞춰 준비합니다.',
      '완료': '방송이 완료되었습니다.',
      '반려': '반려되었습니다. 자세한 내용은 방송부에 문의해 주세요.'
    };

    function MyRequests({ requests, user, addToast }) {
      const [openId, setOpenId] = useState(null);
      const [editing, setEditing] = useState(null);
      const [editForm, setEditForm] = useState(emptyForm);
      const [saving, setSaving] = useState(false);
      const [delTarget, setDelTarget] = useState(null);

      const mine = useMemo(() => !user ? [] :
        requests.filter(r => r.submitterId === user.uid)
          .sort((a, b) => (b.createdAt?.seconds ?? 9e12) - (a.createdAt?.seconds ?? 9e12)),
        [requests, user]);

      const reqDoc = id => doc(db, 'artifacts', appId, 'public', 'data', 'requests', id);
      const canEdit = r => r.status === '대기중' || r.status === '승인됨';
      const canDelete = r => r.status !== '완료';

      const openEdit = (r) => { setEditing(r); setEditForm(toFormState(r)); };
      const saveEdit = async () => {
        const err = validateForm(editForm);
        if (err) { addToast(err, "error"); return; }
        const cur = requests.find(r => r.id === editing.id) || editing;
        if (!canEdit(cur)) { addToast("이미 처리된 요청이라 수정할 수 없습니다. 방송부에 문의해 주세요.", "error"); setEditing(null); return; }
        const data = fromFormState(editForm);
        const changed = diffFields(cur, data);
        if (changed.length === 0) { setEditing(null); addToast("변경된 내용이 없습니다.", "info"); return; }
        setSaving(true);
        try {
          await updateDoc(reqDoc(editing.id), {
            ...data,
            updatedAt: serverTimestamp(),
            requesterEditedAt: serverTimestamp(),
            requesterEditedFields: changed,
            needsReview: true
          });
          addToast("수정 내용이 방송부에 전달되었습니다.", "success");
          setEditing(null);
        } catch (e) { console.error(e); addToast("수정 중 오류가 발생했습니다.", "error"); }
        finally { setSaving(false); }
      };
      const confirmDelete = async () => {
        try { await deleteDoc(reqDoc(delTarget.id)); addToast("신청이 삭제되었습니다.", "success"); }
        catch (e) { console.error(e); addToast("삭제 중 오류가 발생했습니다.", "error"); }
        setDelTarget(null);
      };

      if (!user) return null;

      return (
        <section className="max-w-5xl mx-auto mt-8 fade-in">
          <div className="flex flex-wrap items-end justify-between gap-2 mb-3 px-1">
            <h2 className="text-lg font-bold text-stone-800 flex items-center gap-2">
              내 신청 내역 <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-sage-100 text-sage-800">{mine.length}건</span>
            </h2>
            <p className="text-xs text-stone-400">이 컴퓨터(브라우저)에서 신청한 내역만 표시됩니다.</p>
          </div>

          {mine.length === 0 ? (
            <div className="bg-white rounded-2xl border border-dashed border-stone-300 p-8 text-center text-sm text-stone-400">아직 이 컴퓨터에서 신청한 내역이 없습니다.</div>
          ) : (
            <ul className="space-y-3">
              {mine.map(r => {
                const open = openId === r.id;
                const st = STATUS_STYLE[r.status] || STATUS_STYLE['대기중'];
                return (
                  <li key={r.id} className={`rounded-2xl border border-l-[6px] ${st.bar} bg-white ${open ? 'border-y-sage-300 border-r-sage-300 shadow-sm' : 'border-y-stone-200/70 border-r-stone-200/70'}`}>
                    <div className="px-5 py-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                      <div className="flex-1 min-w-0 cursor-pointer" onClick={() => setOpenId(open ? null : r.id)}>
                        <div className="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 mb-1.5">
                          <StatusBadge status={r.status} />
                          <span className="text-sm font-semibold text-stone-700">{fmtDate(r.broadcastDate)}</span>
                          <span className="text-sm text-stone-500 flex items-center gap-1"><Clock className="w-3.5 h-3.5" />{r.startTime} ~ {r.endTime}</span>
                          {r.needsReview && <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-fuchsia-100 text-fuchsia-800 border border-fuchsia-200">수정 내용 확인 대기</span>}
                        </div>
                        <h3 className="text-base font-bold text-stone-800 truncate">{r.content}</h3>
                        <p className="text-xs text-stone-400 mt-1">{STATUS_HINT[r.status]} {r.createdAt ? `· 접수 ${fmtCreated(r.createdAt)}` : ''}</p>
                        {r.adminEditedAt && (
                          <p className="mt-2 inline-flex items-start gap-1.5 px-2.5 py-1.5 rounded-lg bg-violet-50 border border-violet-200 text-xs text-violet-800">
                            <Pencil className="w-3.5 h-3.5 mt-px shrink-0" />
                            <span><b>방송부에서 내용을 수정했습니다</b> ({fmtCreated(r.adminEditedAt)}){(r.adminEditedFields || []).length > 0 && <> · {(r.adminEditedFields || []).join(', ')}</>}</span>
                          </p>
                        )}
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <button onClick={() => setOpenId(open ? null : r.id)} className="px-3 py-1.5 rounded-lg text-sm font-medium text-stone-500 hover:bg-stone-100 transition">{open ? '접기' : '자세히'}</button>
                        {canEdit(r) && <button onClick={() => openEdit(r)} className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-sage-100 text-sage-800 hover:bg-sage-200 transition"><Pencil className="w-3.5 h-3.5" />수정</button>}
                        {canDelete(r) && <button onClick={() => setDelTarget(r)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-50 transition"><Trash2 className="w-4 h-4" />삭제</button>}
                        {!canEdit(r) && !canDelete(r) && <span className="text-xs text-stone-400">완료된 요청은 수정할 수 없어요</span>}
                      </div>
                    </div>

                    {open && (
                      <div className="px-5 pb-5 pt-4 border-t border-stone-100 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm fade-in">
                        <div className="space-y-3">
                          <div><span className="block text-xs font-semibold text-stone-400 mb-1">방송 내용</span><p className="bg-stone-50 p-3 rounded-xl text-stone-700 whitespace-pre-wrap">{r.content}</p></div>
                          <div className="grid grid-cols-2 gap-3 bg-stone-50 p-3 rounded-xl">
                            <div><span className="block text-xs text-stone-400">의뢰 부서</span><span className="font-medium text-stone-700">{r.department}</span></div>
                            <div><span className="block text-xs text-stone-400">담당자</span><span className="font-medium text-stone-700">{r.requester}</span></div>
                            <div><span className="block text-xs text-stone-400">연락처</span><span className="font-medium text-stone-700">{r.contact || '-'}</span></div>
                            <div><span className="block text-xs text-stone-400">방송 대상</span><span className="font-medium text-stone-700">{r.audience || '-'}</span></div>
                            <div><span className="block text-xs text-stone-400">장소</span><span className="font-medium text-stone-700">{r.location || '-'}</span></div>
                            <div><span className="block text-xs text-stone-400">방송 형태</span><span className="font-medium text-stone-700">{r.broadcastType}</span></div>
                          </div>
                        </div>
                        <div className="space-y-3">
                          <div className="bg-stone-50 p-3 rounded-xl">
                            <span className="block text-xs text-stone-400 mb-2">필요 준비물</span>
                            <div className="flex flex-wrap gap-1.5">
                              {r.equipment?.length > 0 ? r.equipment.map(eq => <span key={eq} className="bg-white border border-stone-200 text-stone-600 px-2.5 py-1 rounded-full text-xs">{eq}</span>) : <span className="text-stone-400">없음</span>}
                            </div>
                          </div>
                          <div className="bg-stone-50 p-3 rounded-xl space-y-2.5">
                            <div>
                              <span className="block text-xs text-stone-400">아나운서 멘트 ({r.scriptType})</span>
                              {r.scriptType === '직접작성' && <p className="mt-1 text-stone-700 bg-white p-2.5 rounded-lg whitespace-pre-wrap">{r.customScript}</p>}
                            </div>
                            <div><span className="block text-xs text-stone-400">자료 링크</span><LinkList text={r.materialLink} /></div>
                            <div><span className="block text-xs text-stone-400">기타 자료/파일 설명</span><span className="text-stone-700">{r.fileDescription || '-'}</span></div>
                            {r.remarks && <div><span className="block text-xs text-stone-400">비고</span><span className="text-stone-700 whitespace-pre-wrap">{r.remarks}</span></div>}
                          </div>
                        </div>
                      </div>
                    )}
                  </li>
                );
              })}
            </ul>
          )}

          {editing && (
            <Modal title="내 신청 수정" onClose={() => setEditing(null)} wide>
              <div className="p-5 sm:p-6 bg-stone-50/60 max-h-[70vh] overflow-y-auto">
                <FormFields data={editForm} setData={setEditForm} requests={requests} excludeId={editing.id} />
              </div>
              <div className="flex items-center justify-between gap-2 px-6 py-4 border-t border-stone-100">
                <p className="text-xs text-stone-400">저장하면 방송부 관리자 화면에 수정 표시와 함께 바로 반영됩니다.</p>
                <div className="flex gap-2">
                  <button onClick={() => setEditing(null)} className={btnGhost}>취소</button>
                  <button onClick={saveEdit} disabled={saving} className={btnPrimary}><Save className="w-4 h-4" />{saving ? '저장 중...' : '수정 내용 저장'}</button>
                </div>
              </div>
            </Modal>
          )}

          {delTarget && (
            <Modal title="신청을 삭제할까요?" onClose={() => setDelTarget(null)}>
              <div className="p-6">
                <p className="text-sm text-stone-700 font-semibold">{delTarget.content}</p>
                <p className="text-sm text-stone-500 mt-1">{fmtDate(delTarget.broadcastDate)} {delTarget.startTime}~{delTarget.endTime}</p>
                <p className="text-sm text-rose-500 mt-3">삭제하면 방송부 관리자 화면에서도 사라지며 되돌릴 수 없습니다.</p>
                <div className="flex justify-end gap-2 mt-6">
                  <button onClick={() => setDelTarget(null)} className={btnGhost}>취소</button>
                  <button onClick={confirmDelete} className="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 transition">삭제</button>
                </div>
              </div>
            </Modal>
          )}
        </section>
      );
    }

    // ==========================================
    // 신청 화면
    // ==========================================
    function RequestForm({ addToast, user, requests, notifyEmail }) {
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [formData, setFormData] = useState(emptyForm);
      const [submitted, setSubmitted] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!user) { addToast("데이터베이스 연결을 확인해주세요.", "error"); return; }
        const err = validateForm(formData);
        if (err) { addToast(err, "error"); return; }

        setIsSubmitting(true);
        try {
          const submitData = {
            ...fromFormState(formData),
            status: '대기중',
            createdAt: serverTimestamp(),
            submitterId: user.uid
          };
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), submitData);

          try {
            await fetch('https://api.emailjs.com/api/v1.0/email/send', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                service_id: 'service_tr7aoyd',
                template_id: 'template_eh0fcth',
                user_id: 'XEI6VfPg_XkMB1uij',
                template_params: {
                  to_email: notifyEmail || DEFAULT_NOTIFY_EMAIL,
                  department: submitData.department,
                  requester: submitData.requester,
                  broadcastDate: submitData.broadcastDate,
                  startTime: submitData.startTime,
                  endTime: submitData.endTime,
                  content: submitData.content,
                  location: submitData.location
                }
              })
            });
          } catch (mailErr) { console.error("이메일 발송 실패", mailErr); }

          setSubmitted(submitData);
          setFormData(emptyForm);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
          console.error(error);
          addToast("제출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      if (submitted) {
        return (
          <div>
            <div className="max-w-xl mx-auto fade-in bg-white rounded-2xl border border-stone-200/70 shadow-sm p-8 text-center">
              <div className="w-16 h-16 mx-auto rounded-full bg-sage-100 flex items-center justify-center mb-5"><CheckCircle className="w-8 h-8 text-sage-600" /></div>
              <h2 className="text-2xl font-bold text-stone-800 mb-2">요청이 접수되었습니다</h2>
              <p className="text-stone-500 text-sm mb-6">방송부에서 확인 후 필요한 경우 연락드리겠습니다.</p>
              <div className="text-left bg-stone-50 rounded-xl p-5 space-y-2.5 text-sm border border-stone-100">
                <div className="flex justify-between gap-4"><span className="text-stone-400">방송일</span><span className="font-medium text-stone-700">{fmtDate(submitted.broadcastDate)} {submitted.startTime}~{submitted.endTime}</span></div>
                <div className="flex justify-between gap-4"><span className="text-stone-400">내용</span><span className="font-medium text-stone-700 text-right">{submitted.content}</span></div>
                <div className="flex justify-between gap-4"><span className="text-stone-400">요청자</span><span className="font-medium text-stone-700">{submitted.department} {submitted.requester}</span></div>
              </div>
              <button onClick={() => setSubmitted(null)} className={`${btnPrimary} mt-7`}>다른 요청 작성하기</button>
            </div>
            <MyRequests requests={requests} user={user} addToast={addToast} />
          </div>
        );
      }

      return (
        <div>
          <div className="max-w-5xl mx-auto fade-in">
            <form onSubmit={handleSubmit}>
              <CompactForm data={formData} setData={setFormData} requests={requests} isSubmitting={isSubmitting} />
            </form>
          </div>
          <MyRequests requests={requests} user={user} addToast={addToast} />
        </div>
      );
    }

    // ==========================================
    // 달력
    // ==========================================
    function MonthCalendar({ requests, selectedDate, onSelect }) {
      const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
      const today = todayStr();

      const byDate = useMemo(() => {
        const m = {};
        requests.forEach(r => { if (r.broadcastDate) (m[r.broadcastDate] = m[r.broadcastDate] || []).push(r); });
        return m;
      }, [requests]);

      const y = cursor.getFullYear(), mo = cursor.getMonth();
      const firstDow = new Date(y, mo, 1).getDay();
      const daysInMonth = new Date(y, mo + 1, 0).getDate();
      const cells = [...Array(firstDow).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

      return (
        <div className="bg-white rounded-2xl border border-stone-200/70 shadow-sm p-5">
          <div className="flex items-center justify-between mb-4">
            <button onClick={() => setCursor(new Date(y, mo - 1, 1))} className="p-1.5 rounded-lg hover:bg-stone-100 text-stone-500"><ChevronLeft className="w-5 h-5" /></button>
            <div className="text-center">
              <div className="font-bold text-stone-800">{y}년 {mo + 1}월</div>
              <button onClick={() => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); }} className="text-xs text-sage-600 hover:underline">오늘로 이동</button>
            </div>
            <button onClick={() => setCursor(new Date(y, mo + 1, 1))} className="p-1.5 rounded-lg hover:bg-stone-100 text-stone-500"><ChevronRight className="w-5 h-5" /></button>
          </div>
          <div className="grid grid-cols-7 text-center text-xs font-medium mb-1">
            {DOW.map((d, i) => <div key={d} className={`py-1.5 ${i === 0 ? 'text-rose-400' : i === 6 ? 'text-sky-500' : 'text-stone-400'}`}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-y-1">
            {cells.map((day, idx) => {
              if (!day) return <div key={`e${idx}`} />;
              const ds = `${y}-${pad(mo + 1)}-${pad(day)}`;
              const list = byDate[ds] || [];
              const isSel = selectedDate === ds;
              const isToday = ds === today;
              const dow = (firstDow + day - 1) % 7;
              return (
                <button key={ds} onClick={() => onSelect(isSel ? null : ds)}
                  className={`relative h-12 mx-0.5 rounded-xl flex flex-col items-center justify-center transition
                    ${isSel ? 'bg-sage-600 text-white shadow-sm' : isToday ? 'bg-sage-100 text-sage-800 font-bold' : 'hover:bg-stone-100'}
                    ${!isSel && !isToday ? (dow === 0 ? 'text-rose-400' : dow === 6 ? 'text-sky-600' : 'text-stone-700') : ''}`}>
                  <span className="text-sm leading-none">{day}</span>
                  <span className="flex gap-0.5 mt-1.5 h-1.5 items-center">
                    {list.slice(0, 3).map(r => <span key={r.id} className={`w-1.5 h-1.5 rounded-full ${isSel ? 'bg-white' : STATUS_STYLE[r.status]?.dot || 'bg-stone-300'}`}></span>)}
                    {list.length > 3 && <span className={`text-[9px] leading-none ${isSel ? 'text-white' : 'text-stone-400'}`}>+{list.length - 3}</span>}
                  </span>
                </button>
              );
            })}
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 mt-4 pt-4 border-t border-stone-100 text-xs text-stone-500">
            {['대기중', '승인됨', '완료', '반려'].map(s => <span key={s} className="flex items-center gap-1.5"><span className={`w-2 h-2 rounded-full ${STATUS_STYLE[s].dot}`}></span>{s}</span>)}
            <span className="text-stone-400">· 방송일 기준</span>
          </div>
        </div>
      );
    }

                    {req.adminEditedAt && !req.adminEditAck && <button onClick={() => onAckAdmin(req.id)} className="inline-flex items-center gap-1.5 mr-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-violet-600 text-white hover:bg-violet-700 transition"><CheckCircle className="w-3.5 h-3.5" />관리자 수정 확인 완료</button>}

    // ==========================================
    // 관리자 대시보드
    // ==========================================
    function AdminDashboard({ requests, addToast }) {
      const [filter, setFilter] = useState('all');
      const [scope, setScope] = useState('upcoming');
      const [sortBy, setSortBy] = useState('date');
      const [query, setQuery] = useState('');
      const [selectedDate, setSelectedDate] = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      const [editing, setEditing] = useState(null);
      const [editForm, setEditForm] = useState(emptyForm);
      const [saving, setSaving] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [flagFilter, setFlagFilter] = useState(null); // 'admin' | 'requester' | null

      const today = todayStr();
      const reqDoc = id => doc(db, 'artifacts', appId, 'public', 'data', 'requests', id);
      const reviewCount = requests.filter(r => r.needsReview).length;
      const adminEditCount = requests.filter(r => r.adminEditedAt && !r.adminEditAck && r.broadcastDate >= today).length;

      const conflictIds = useMemo(() => {
        const live = requests.filter(r => r.status !== '반려');
        const set = new Set();
        live.forEach((a, i) => live.slice(i + 1).forEach(b => { if (overlaps(a, b)) { set.add(a.id); set.add(b.id); } }));
        return set;
      }, [requests]);

      const stats = useMemo(() => {
        const d = new Date(); const dow = d.getDay();
        const weekStart = toYMD(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow));
        const weekEnd = toYMD(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow + 6));
        return {
          pending: requests.filter(r => r.status === '대기중').length,
          today: requests.filter(r => r.broadcastDate === today && r.status !== '반려').length,
          week: requests.filter(r => r.broadcastDate >= weekStart && r.broadcastDate <= weekEnd && r.status !== '반려').length,
          done: requests.filter(r => r.status === '완료').length
        };
      }, [requests]);

      const todayList = useMemo(() =>
        requests.filter(r => r.broadcastDate === today && (r.status === '승인됨' || r.status === '대기중'))
          .sort((a, b) => toMin(a.startTime) - toMin(b.startTime)), [requests]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return requests
          .filter(r => filter === 'all' || r.status === filter)
          .filter(r => flagFilter === 'admin' ? (!!r.adminEditedAt && !r.adminEditAck) : flagFilter === 'requester' ? !!r.needsReview : true)
          .filter(r => {
            if (selectedDate) return r.broadcastDate === selectedDate;
            if (scope === 'upcoming') return r.broadcastDate >= today || r.status === '대기중';
            if (scope === 'past') return r.broadcastDate < today;
            return true;
          })
          .filter(r => !q || [r.content, r.requester, r.department, r.location, r.audience].some(v => (v || '').toLowerCase().includes(q)))
          .sort((a, b) => {
            if (sortBy === 'created') return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
            const da = `${a.broadcastDate}T${a.startTime}`, db_ = `${b.broadcastDate}T${b.startTime}`;
            return scope === 'past' && !selectedDate ? db_.localeCompare(da) : da.localeCompare(db_);
          });
      }, [requests, filter, scope, sortBy, query, selectedDate, flagFilter]);

      const updateStatus = async (id, status) => {
        try { await updateDoc(reqDoc(id), { status, updatedAt: serverTimestamp() }); addToast(`상태가 '${status}'(으)로 변경되었습니다.`, "success"); }
        catch (e) { console.error(e); addToast("상태 변경에 실패했습니다.", "error"); }
      };
      const ackReview = async (id) => {
        try { await updateDoc(reqDoc(id), { needsReview: false }); addToast("신청자 수정 내용을 확인 처리했습니다.", "success"); }
        catch (e) { addToast("확인 처리에 실패했습니다.", "error"); }
      };
      const ackAdminEdit = async (id) => {
        try { await updateDoc(reqDoc(id), { adminEditAck: true }); addToast("관리자 수정 알림을 확인 처리했습니다.", "success"); }
        catch (e) { addToast("확인 처리에 실패했습니다.", "error"); }
      };
      const ackAllAdminEdits = async () => {
        const targets = requests.filter(r => r.adminEditedAt && !r.adminEditAck && r.broadcastDate >= today);
        try { await Promise.all(targets.map(r => updateDoc(reqDoc(r.id), { adminEditAck: true }))); addToast(`관리자 수정 ${targets.length}건을 모두 확인 처리했습니다.`, "success"); setFlagFilter(null); }
        catch (e) { addToast("확인 처리에 실패했습니다.", "error"); }
      };
      const saveMemo = async (id, adminMemo) => {
        try { await updateDoc(reqDoc(id), { adminMemo }); addToast("메모를 저장했습니다.", "success"); }
        catch (e) { addToast("메모 저장 실패", "error"); }
      };
      const openEdit = (req) => { setEditing(req); setEditForm(toFormState(req)); };
      const saveEdit = async () => {
        const err = validateForm(editForm);
        if (err) { addToast(err, "error"); return; }
        const data = fromFormState(editForm);
        const cur = requests.find(r => r.id === editing.id) || editing;
        const changed = diffFields(cur, data);
        if (changed.length === 0) { setEditing(null); addToast("변경된 내용이 없습니다.", "info"); return; }
        setSaving(true);
        try {
          await updateDoc(reqDoc(editing.id), { ...data, updatedAt: serverTimestamp(), adminEditedAt: serverTimestamp(), adminEditedFields: changed, adminEditAck: false });
          addToast(`요청 내용을 수정했습니다. (${changed.join(', ')})`, "success");
          setEditing(null);
        } catch (e) { console.error(e); addToast("수정에 실패했습니다.", "error"); }
        finally { setSaving(false); }
      };
      const confirmDelete = async () => {
        try { await deleteDoc(reqDoc(deleteTarget.id)); addToast("요청이 삭제되었습니다.", "success"); }
        catch (e) { addToast("삭제 실패", "error"); }
        setDeleteTarget(null);
      };

      const exportCsv = () => {
        const head = ['방송일', '시작', '종료', '상태', '부서', '담당자', '연락처', '방송내용', '대상', '장소', '방송형태', '준비물', '멘트', '자료링크', '비고', '관리자메모'];
        const rows = filtered.map(r => [r.broadcastDate, r.startTime, r.endTime, r.status, r.department, r.requester, r.contact, r.content, r.audience, r.location, r.broadcastType, (r.equipment || []).join('/'), r.scriptType === '직접작성' ? r.customScript : r.scriptType, r.materialLink, r.remarks, r.adminMemo]);
        const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const csv = '\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = `방송요청_${today}.csv`; a.click();
      };

      const statCards = [
        { label: '승인 대기', value: stats.pending, tone: 'text-amber-700 bg-amber-50', onClick: () => { setFilter('대기중'); setScope('all'); setSelectedDate(null); } },
        { label: '오늘 방송', value: stats.today, tone: 'text-emerald-800 bg-emerald-100', onClick: () => setSelectedDate(today) },
        { label: '이번 주 방송', value: stats.week, tone: 'text-stone-700 bg-stone-100', onClick: () => { setFilter('all'); setScope('upcoming'); setSelectedDate(null); } },
        { label: '완료', value: stats.done, tone: 'text-blue-800 bg-blue-100', onClick: () => { setFilter('완료'); setScope('all'); setSelectedDate(null); } }
      ];

      return (
        <div className="max-w-6xl mx-auto space-y-5 fade-in">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl font-bold text-stone-800 flex items-center gap-2"><Video className="w-6 h-6 text-sage-600" />방송 요청 관리</h2>
              <p className="text-stone-500 text-sm mt-1">{fmtDate(today)} · 전체 {requests.length}건</p>
            </div>
            <button onClick={exportCsv} className={btnGhost}><Download className="w-4 h-4" />엑셀(CSV) 저장</button>
          </div>

          {todayList.length > 0 && (
            <div className="rounded-2xl bg-sage-50 border border-sage-200 p-5">
              <div className="flex items-center gap-2 text-sage-800 font-bold mb-3"><Bell className="w-4 h-4" />오늘의 방송 {todayList.length}건</div>
              <ul className="space-y-1.5">
                {todayList.map(r => (
                  <li key={r.id} className="flex flex-wrap items-center gap-x-3 text-sm text-stone-700">
                    <span className="font-semibold tabular-nums text-sage-800">{r.startTime}~{r.endTime}</span>
                    <span className="font-medium">{r.content}</span>
                    <span className="text-stone-400">{r.department} {r.requester} · {r.location || '장소 미정'}</span>
                    {r.status === '대기중' && <span className="text-amber-700 text-xs font-semibold">승인 대기</span>}
                  </li>
                ))}
              </ul>
            </div>
          )}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            {statCards.map(c => (
              <button key={c.label} onClick={c.onClick} className="text-left bg-white rounded-2xl border border-stone-200/70 p-4 hover:border-sage-300 hover:shadow-sm transition">
                <div className="text-sm text-stone-500 mb-2">{c.label}</div>
                <div className={`inline-flex items-baseline gap-1 px-2.5 py-1 rounded-lg ${c.tone}`}><span className="text-2xl font-bold tabular-nums">{c.value}</span><span className="text-xs">건</span></div>
              </button>
            ))}
          </div>

          {(reviewCount > 0 || adminEditCount > 0 || flagFilter) && (
            <div className="flex flex-wrap items-center gap-2">
              {reviewCount > 0 && (
                <button onClick={() => { setFlagFilter(flagFilter === 'requester' ? null : 'requester'); setFilter('all'); setScope('all'); setSelectedDate(null); }}
                  className={`inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-white bg-fuchsia-600 hover:bg-fuchsia-700 shadow-sm transition ${flagFilter === 'requester' ? 'ring-4 ring-fuchsia-200' : ''}`}>
                  <Bell className="w-4 h-4" />신청자가 수정한 요청 {reviewCount}건 · 확인 필요
                </button>
              )}
              {adminEditCount > 0 && (
                <button onClick={() => { setFlagFilter(flagFilter === 'admin' ? null : 'admin'); setFilter('all'); setScope('upcoming'); setSelectedDate(null); }}
                  className={`inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-white bg-violet-600 hover:bg-violet-700 shadow-sm transition ${flagFilter === 'admin' ? 'ring-4 ring-violet-200' : ''}`}>
                  <Pencil className="w-4 h-4" />관리자가 수정한 예정 요청 {adminEditCount}건
                </button>
              )}
              {adminEditCount > 0 && <button onClick={ackAllAdminEdits} className="inline-flex items-center gap-1 px-3 py-2 rounded-xl text-sm font-semibold text-violet-700 bg-violet-50 hover:bg-violet-100 border border-violet-200 transition"><CheckCircle className="w-4 h-4" />모두 확인 완료</button>}
              {flagFilter && <button onClick={() => setFlagFilter(null)} className="inline-flex items-center gap-1 px-3 py-2 rounded-xl text-sm text-stone-500 hover:bg-stone-100"><X className="w-4 h-4" />필터 해제</button>}
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-5 items-start">
            <div className="lg:sticky lg:top-20">
              <MonthCalendar requests={requests} selectedDate={selectedDate} onSelect={setSelectedDate} />
            </div>

            <div className="space-y-3 min-w-0">
              <div className="bg-white rounded-2xl border border-stone-200/70 p-4 space-y-3">
                <div className="relative">
                  <Search className="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input value={query} onChange={e => setQuery(e.target.value)} placeholder="방송 내용, 담당자, 부서, 장소 검색" className={`${inputCls} pl-10`} />
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  {['all', ...STATUSES].map(f => (
                    <button key={f} onClick={() => setFilter(f)} className={`px-3 py-1.5 rounded-full text-sm font-medium transition ${filter === f ? (f === 'all' ? 'bg-stone-700 text-white' : STATUS_STYLE[f].solid) : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>{f === 'all' ? '전체' : f}</button>
                  ))}
                  <div className="ml-auto flex gap-2">
                    <select value={scope} onChange={e => setScope(e.target.value)} disabled={!!selectedDate} className="text-sm rounded-lg border border-stone-200 bg-white px-2.5 py-1.5 disabled:opacity-50">
                      <option value="upcoming">예정</option><option value="past">지난 방송</option><option value="all">전체 기간</option>
                    </select>
                    <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="text-sm rounded-lg border border-stone-200 bg-white px-2.5 py-1.5">
                      <option value="date">방송일순</option><option value="created">최근 접수순</option>
                    </select>
                  </div>
                </div>
                {selectedDate && (
                  <div className="flex items-center gap-2 text-sm">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sage-100 text-sage-800 font-medium">{fmtDate(selectedDate)} 요청만 보기
                      <button onClick={() => setSelectedDate(null)}><X className="w-3.5 h-3.5" /></button></span>
                  </div>
                )}
              </div>

              {filtered.length === 0 ? (
                <div className="bg-white rounded-2xl border border-dashed border-stone-300 p-12 text-center text-stone-400">조건에 맞는 방송 요청이 없습니다.</div>
              ) : (
                <ul className="space-y-3">
                  {filtered.map(req => (
                    <RequestRow key={req.id} req={req} expanded={expandedId === req.id}
                      onToggle={() => setExpandedId(expandedId === req.id ? null : req.id)}
                      hasConflict={conflictIds.has(req.id)}
                      onStatus={updateStatus} onEdit={openEdit} onDelete={setDeleteTarget} onMemo={saveMemo} onAck={ackReview} onAckAdmin={ackAdminEdit} />
                  ))}
                </ul>
              )}
            </div>
          </div>

          {editing && (
            <Modal title="요청 내용 수정" onClose={() => setEditing(null)} wide>
              <div className="p-5 sm:p-6 bg-stone-50/60 max-h-[70vh] overflow-y-auto">
                <FormFields data={editForm} setData={setEditForm} requests={requests} excludeId={editing.id} />
              </div>
              <div className="flex justify-end gap-2 px-6 py-4 border-t border-stone-100">
                <button onClick={() => setEditing(null)} className={btnGhost}>취소</button>
                <button onClick={saveEdit} disabled={saving} className={btnPrimary}><Save className="w-4 h-4" />{saving ? '저장 중...' : '수정 내용 저장'}</button>
              </div>
            </Modal>
          )}

          {deleteTarget && (
            <Modal title="요청을 삭제할까요?" onClose={() => setDeleteTarget(null)}>
              <div className="p-6">
                <p className="text-sm text-stone-600 mb-1"><b>{deleteTarget.content}</b></p>
                <p className="text-sm text-stone-500">{fmtDate(deleteTarget.broadcastDate)} · {deleteTarget.department} {deleteTarget.requester}</p>
                <p className="text-sm text-rose-500 mt-3">삭제하면 되돌릴 수 없습니다. 기록을 남기려면 '반려'로 변경하세요.</p>
                <div className="flex justify-end gap-2 mt-6">
                  <button onClick={() => setDeleteTarget(null)} className={btnGhost}>취소</button>
                  <button onClick={confirmDelete} className="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 transition">삭제</button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ==========================================
    // 관리자 설정
    // ==========================================
    function AdminSettings({ addToast, currentPassword, notifyEmail }) {
      const [oldPw, setOldPw] = useState('');
      const [newPw, setNewPw] = useState('');
      const [confirmPw, setConfirmPw] = useState('');
      const [isUpdating, setIsUpdating] = useState(false);
      const [email, setEmail] = useState(notifyEmail);
      useEffect(() => setEmail(notifyEmail), [notifyEmail]);

      const settingsDoc = id => doc(db, 'artifacts', appId, 'public', 'data', 'settings', id);

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (oldPw !== currentPassword) return addToast("현재 비밀번호가 일치하지 않습니다.", "error");
        if (newPw !== confirmPw) return addToast("새 비밀번호와 확인 비밀번호가 다릅니다.", "error");
        if (newPw.length < 4) return addToast("비밀번호는 4자리 이상이어야 합니다.", "error");
        setIsUpdating(true);
        try {
          await setDoc(settingsDoc('adminAuth'), { password: newPw, updatedAt: serverTimestamp() });
          addToast("비밀번호가 변경되었습니다.", "success");
          setOldPw(''); setNewPw(''); setConfirmPw('');
        } catch (error) { addToast("비밀번호 변경 실패", "error"); }
        finally { setIsUpdating(false); }
      };

      const saveEmail = async (e) => {
        e.preventDefault();
        if (!/^\S+@\S+\.\S+$/.test(email)) return addToast("올바른 이메일 주소를 입력해주세요.", "error");
        try { await setDoc(settingsDoc('notify'), { email, updatedAt: serverTimestamp() }); addToast("알림 메일 주소를 저장했습니다.", "success"); }
        catch (err) { addToast("저장 실패", "error"); }
      };

      return (
        <div className="max-w-xl mx-auto space-y-5 fade-in">
          <h2 className="text-2xl font-bold text-stone-800 flex items-center gap-2"><Settings className="w-6 h-6 text-sage-600" />관리자 설정</h2>

          <form onSubmit={saveEmail} className="bg-white rounded-2xl border border-stone-200/70 p-6 space-y-4">
            <h3 className="font-bold text-stone-800 flex items-center gap-2"><Mail className="w-4 h-4 text-sage-600" />알림 메일 주소</h3>
            <p className="text-sm text-stone-500">새 요청이 접수될 때와, 방송 당일 오전 8시 30분 안내 메일을 이 주소로 받습니다.</p>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} className={inputCls} />
            <div className="flex justify-end"><button type="submit" className={btnPrimary}>저장</button></div>
          </form>

          <form onSubmit={handleChangePassword} className="bg-white rounded-2xl border border-stone-200/70 p-6 space-y-4">
            <h3 className="font-bold text-stone-800 flex items-center gap-2"><Key className="w-4 h-4 text-sage-600" />비밀번호 변경</h3>
            <Field label="관리자 아이디"><input type="text" value="admin" disabled className={`${inputCls} bg-stone-100 text-stone-500`} /></Field>
            <Field label="현재 비밀번호"><input type="password" value={oldPw} onChange={e => setOldPw(e.target.value)} required className={inputCls} /></Field>
            <Field label="새 비밀번호" hint="4자리 이상"><input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} required className={inputCls} /></Field>
            <Field label="새 비밀번호 확인"><input type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} required className={inputCls} /></Field>
            <div className="flex justify-end"><button type="submit" disabled={isUpdating} className={btnPrimary}>{isUpdating ? '변경 중...' : '비밀번호 변경'}</button></div>
          </form>
        </div>
      );
    }

    // ==========================================
    // 메인 앱
    // ==========================================
    function App() {
      const [user, setUser] = useState(null);
      const [authInitialized, setAuthInitialized] = useState(false);
      const [view, setView] = useState('form');
      const [firebaseError, setFirebaseError] = useState(false);
      const [requests, setRequests] = useState([]);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPassword, setAdminPassword] = useState('admin');
      const [notifyEmail, setNotifyEmail] = useState(DEFAULT_NOTIFY_EMAIL);
      const [toasts, setToasts] = useState([]);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginIdInput, setLoginIdInput] = useState('');
      const [loginPwInput, setLoginPwInput] = useState('');

      const isAdminRef = useRef(false);
      const initialLoadDone = useRef(false);
      const editSeen = useRef({});
      useEffect(() => { isAdminRef.current = isAdmin; }, [isAdmin]);

      const addToast = (message, type = 'info') => {
        const id = Date.now().toString() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      // 인증
      useEffect(() => {
        if (!isPreviewEnvironment && firebaseConfig.apiKey.includes("여기에")) {
          setFirebaseError(true); setAuthInitialized(true); return;
        }
        let mounted = true;
        (async () => {
          try {
            if (isPreviewEnvironment && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
            else await signInAnonymously(auth);
          } catch (error) { console.error("Auth init error:", error); setFirebaseError(true); }
        })();
        const unsub = onAuthStateChanged(auth, u => { if (mounted) { setUser(u); setAuthInitialized(true); } });
        return () => { mounted = false; unsub(); };
      }, []);

      // 데이터 구독
      useEffect(() => {
        if (!user || firebaseError) return;
        const unsubReq = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), (snapshot) => {
          const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          setRequests(list);
          if (initialLoadDone.current && isAdminRef.current) {
            const hasNew = snapshot.docChanges().some(c => c.type === 'added' && !c.doc.metadata.hasPendingWrites);
            if (hasNew) addToast("🔔 새로운 방송 협조 요청이 도착했습니다!", "success");
            // 신청자가 내용을 수정했을 때 알림
            list.forEach(r => {
              const sec = r.requesterEditedAt?.seconds || 0;
              if (sec && sec !== editSeen.current[r.id]) addToast(`✏ 신청자가 요청을 수정했습니다: ${r.content}`, "success");
            });
          }
          list.forEach(r => { editSeen.current[r.id] = r.requesterEditedAt?.seconds || 0; });
          initialLoadDone.current = true;
        }, err => console.error("Requests fetch error:", err));

        const unsubSettings = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'settings'), (snapshot) => {
          const authDoc = snapshot.docs.find(d => d.id === 'adminAuth');
          setAdminPassword(authDoc?.data().password || 'admin');
          const notifyDoc = snapshot.docs.find(d => d.id === 'notify');
          setNotifyEmail(notifyDoc?.data().email || DEFAULT_NOTIFY_EMAIL);
        });

        const unsubProfile = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'profile'), (snapshot) => {
          const info = snapshot.docs.find(d => d.id === 'info');
          setIsAdmin(!!(info && info.data().isAdmin));
        });
        return () => { unsubReq(); unsubSettings(); unsubProfile(); };
      }, [user, firebaseError]);

      const pendingCount = requests.filter(r => r.status === '대기중').length;
      useEffect(() => {
        document.title = `${isAdmin && pendingCount > 0 ? `(${pendingCount}) ` : ''}영파여자중학교 방송요청 시스템`;
      }, [isAdmin, pendingCount]);

      const handleLoginClick = () => { setLoginIdInput(''); setLoginPwInput(''); setShowLoginModal(true); setIsMenuOpen(false); };

      const executeLogin = async (e) => {
        e.preventDefault();
        if (loginIdInput === 'admin' && loginPwInput === adminPassword) {
          try {
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'info'), { isAdmin: true });
            setShowLoginModal(false);
            addToast("관리자 로그인 성공", "success");
            setView('dashboard');
          } catch (error) { addToast("로그인 오류 (데이터베이스 권한을 확인해주세요)", "error"); }
        } else addToast("아이디 또는 비밀번호가 일치하지 않습니다.", "error");
      };

      const handleLogout = async () => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'info'), { isAdmin: false });
          setView('form');
          addToast("로그아웃 되었습니다.", "info");
        } catch (error) { console.error(error); }
      };

      if (!authInitialized) {
        return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-sage-600"></div></div>;
      }

      if (firebaseError) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-lg max-w-lg w-full text-center">
              <div className="w-14 h-14 mx-auto bg-rose-100 rounded-full flex items-center justify-center mb-4"><AlertCircle className="w-7 h-7 text-rose-500" /></div>
              <h2 className="text-xl font-bold text-stone-800 mb-2">데이터베이스(Firebase) 연결이 필요합니다.</h2>
              <p className="text-stone-500 text-sm">소스 코드의 <code>firebaseConfig</code> 값과 Firebase 콘솔의 익명 로그인 설정을 확인해주세요.</p>
            </div>
          </div>
        );
      }

      const tabCls = (v) => `px-3.5 py-2 rounded-lg text-sm font-medium transition ${view === v ? 'bg-sage-100 text-sage-800' : 'text-stone-500 hover:bg-stone-100'}`;
      const mTabCls = (v) => `block w-full text-left px-3 py-2.5 rounded-lg text-base font-medium ${view === v ? 'bg-sage-100 text-sage-800' : 'text-stone-600 hover:bg-stone-50'}`;

      return (
        <div className="min-h-screen font-sans text-stone-800">
          <nav className="bg-white/85 backdrop-blur border-b border-stone-200/70 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              <div className="flex justify-between h-16 items-center">
                <button className="flex items-center gap-2.5" onClick={() => setView('form')}>
                  <span className="w-9 h-9 rounded-xl bg-sage-600 text-white flex items-center justify-center"><Mic className="h-5 w-5" /></span>
                  <span className="font-bold text-[17px] text-stone-800 tracking-tight">영파여자중학교 방송요청</span>
                </button>

                <div className="hidden sm:flex items-center gap-1">
                  <button onClick={() => setView('form')} className={tabCls('form')}>신청하기</button>
                  {isAdmin && <>
                    <button onClick={() => setView('dashboard')} className={`${tabCls('dashboard')} relative`}>
                      관리자 대시보드
                      {pendingCount > 0 && <span className="ml-1.5 inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full bg-amber-400 text-white text-xs font-bold">{pendingCount}</span>}
                    </button>
                    <button onClick={() => setView('settings')} className={tabCls('settings')}>설정</button>
                  </>}
                  {isAdmin ? (
                    <div className="flex items-center ml-3 pl-3 border-l border-stone-200 gap-3">
                      <span className="text-xs font-semibold text-sage-700 bg-sage-100 px-2.5 py-1 rounded-full">관리자</span>
                      <button onClick={handleLogout} className="text-stone-400 hover:text-rose-500 flex items-center gap-1 text-sm transition"><LogOut className="h-4 w-4" />로그아웃</button>
                    </div>
                  ) : (
                    <button onClick={handleLoginClick} className="ml-2 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium text-stone-600 hover:bg-stone-100 transition"><Key className="w-4 h-4" />관리자</button>
                  )}
                </div>

                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="sm:hidden p-2 rounded-lg text-stone-500 hover:bg-stone-100 text-sm font-medium flex items-center gap-1.5">
                  {isMenuOpen ? <X className="h-5 w-5" /> : <span>메뉴</span>}
                </button>
              </div>
            </div>

            {isMenuOpen && (
              <div className="sm:hidden border-t border-stone-100 bg-white px-3 py-2 space-y-1">
                <button onClick={() => { setView('form'); setIsMenuOpen(false); }} className={mTabCls('form')}>신청하기</button>
                {isAdmin && <>
                  <button onClick={() => { setView('dashboard'); setIsMenuOpen(false); }} className={mTabCls('dashboard')}>관리자 대시보드 {pendingCount > 0 && `(${pendingCount})`}</button>
                  <button onClick={() => { setView('settings'); setIsMenuOpen(false); }} className={mTabCls('settings')}>설정</button>
                </>}
                {!isAdmin
                  ? <button onClick={handleLoginClick} className="block w-full text-left px-3 py-2.5 text-base font-medium text-sage-700">관리자 로그인</button>
                  : <button onClick={() => { handleLogout(); setIsMenuOpen(false); }} className="block w-full text-left px-3 py-2.5 text-base font-medium text-rose-500">로그아웃</button>}
              </div>
            )}
          </nav>

          <main className={`max-w-6xl mx-auto px-4 sm:px-6 pb-16 ${view === 'form' ? 'py-5' : 'py-8'}`}>
            {view === 'form' && <RequestForm addToast={addToast} user={user} requests={requests} notifyEmail={notifyEmail} />}
            {view === 'dashboard' && isAdmin && <AdminDashboard requests={requests} addToast={addToast} />}
            {view === 'settings' && isAdmin && <AdminSettings addToast={addToast} currentPassword={adminPassword} notifyEmail={notifyEmail} />}

            {view !== 'form' && !isAdmin && (
              <div className="text-center py-24">
                <Shield className="mx-auto h-14 w-14 text-stone-300 mb-4" />
                <h2 className="text-xl font-bold text-stone-700">접근 권한이 없습니다</h2>
                <p className="text-stone-500 mt-2 text-sm">이 페이지는 방송부 관리자만 볼 수 있습니다.</p>
                <button onClick={handleLoginClick} className={`${btnPrimary} mt-6`}><Key className="w-4 h-4" />관리자 로그인</button>
              </div>
            )}
          </main>

          {showLoginModal && (
            <Modal title="관리자 로그인" onClose={() => setShowLoginModal(false)}>
              <form onSubmit={executeLogin} className="p-6 space-y-4">
                <p className="text-sm text-stone-500">방송부원 전용 페이지입니다.</p>
                <Field label="아이디"><input type="text" value={loginIdInput} onChange={e => setLoginIdInput(e.target.value)} placeholder="admin" autoFocus required className={inputCls} /></Field>
                <Field label="비밀번호"><input type="password" value={loginPwInput} onChange={e => setLoginPwInput(e.target.value)} required className={inputCls} /></Field>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setShowLoginModal(false)} className={`${btnGhost} flex-1`}>취소</button>
                  <button type="submit" className={`${btnPrimary} flex-1`}>로그인</button>
                </div>
              </form>
            </Modal>
          )}

          <div className="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`fade-in flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white pointer-events-auto ${t.type === 'success' ? 'bg-sage-700' : t.type === 'error' ? 'bg-rose-500' : 'bg-stone-700'}`}>
                {t.type === 'success' && <CheckCircle className="w-4 h-4" />}
                {t.type === 'error' && <AlertCircle className="w-4 h-4" />}
                {t.type === 'info' && <Bell className="w-4 h-4" />}
                {t.message}
              </div>
            ))}
          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
